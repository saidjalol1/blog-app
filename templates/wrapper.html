<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Modern blog platform delivering quality content on technology, business, design, and lifestyle">
    <meta name="keywords" content="blog, technology, business, design, lifestyle">
    <meta name="author" content="My Logo">
    <title>My Logo - Modern Blog | Latest Articles & Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'style/main.css' %}">
    <link rel="stylesheet" href="{% static 'style/pages.css' %}">
</head>

<body class="bg-slate-50">
    {% include 'components/navbar.html' %}
    
    {% block content %} {% endblock content %}

    {% include 'components/footer.html' %}

    <!-- <script src="./js/anti-devtools.js" defer></script> -->
    <script src="{% static 'js/main.js' %}" defer></script>
    <script type="module" src="{% static 'js/index.js' %}" defer></script>
</body>

</html>
